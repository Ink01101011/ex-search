name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting is OS-independent; run it once on Linux. On Windows runners
  # core.autocrlf=true would otherwise turn every file into CRLF and Prettier
  # (endOfLine "lf" by default) would fail the whole tree.
  format:
    runs-on: ubuntu-latest
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 18 = declared floor (package.json engines ">=18"); 20/22/24 = supported lines.
        node: [18, 20, 22, 24]
    env:
      CI: true
      HUSKY: 0

    defaults:
      run:
        shell: bash

    steps:
      - name: Disable CRLF conversion (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlint 1.6x declares engines ^20.19 || >=22.12, so pnpm skips its native
      # binding on Node 18. Lint is dev tooling, not the library: run it elsewhere.
      - name: Lint
        if: matrix.node != 18
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm exec jest --ci

      - name: Build
        run: pnpm run build

      # prepublishOnly publishes the minified build, so the tarball smoke tests
      # below must run against that output, not the unminified one.
      - name: Minify (prepublishOnly output)
        run: pnpm run minify

      # npm 10.8 (bundled with Node 18) still runs the `prepare` script (husky)
      # despite --ignore-scripts; HUSKY=0 above keeps that a no-op.
      - name: Pack tarball
        run: |
          WORK="$(node -p "require('path').join(require('os').tmpdir(),'ex-search-smoke').split(require('path').sep).join('/')")"
          rm -rf "$WORK" && mkdir -p "$WORK/pack"
          npm pack --ignore-scripts --pack-destination "$WORK/pack"
          echo "SMOKE_WORK=$WORK" >> "$GITHUB_ENV"

      - name: Smoke test packed tarball (require + import every exports subpath)
        run: |
          TARBALL="$(ls "$SMOKE_WORK"/pack/*.tgz)"
          CONSUMER="$SMOKE_WORK/consumer"
          mkdir -p "$CONSUMER" && cd "$CONSUMER"
          echo '{ "name": "smoke-consumer", "private": true }' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL" exsorted@^1.1.0 ex-flow@^1.0.4 react@^19

          cat > smoke.cjs <<'EOF'
          const subpaths = ['ex-search', 'ex-search/types', 'ex-search/precision', 'ex-search/react'];
          let fail = 0;
          for (const s of subpaths) {
            try {
              const m = require(s);
              console.log(`ok   require ${s}: ${Object.keys(m).sort().join(',')}`);
            } catch (e) {
              fail++;
              console.error(`FAIL require ${s}: ${e.code} ${e.message}`);
            }
          }
          const { search, ExSearch, Scorer } = require('ex-search');
          const r = search([{ n: 'Istanbul' }, { n: 'Ankara' }], 'ista', { keys: [{ name: 'n', weight: 1 }] });
          if (r.length !== 1 || r[0].n !== 'Istanbul') { fail++; console.error('FAIL search() result', JSON.stringify(r)); }
          if (typeof ExSearch !== 'function' || typeof Scorer !== 'object') { fail++; console.error('FAIL ExSearch/Scorer shape'); }
          const { useExSearch, useExSearchAsync } = require('ex-search/react');
          if (typeof useExSearch !== 'function' || typeof useExSearchAsync !== 'function') { fail++; console.error('FAIL react hooks'); }
          console.log(`require smoke on node ${process.version}: failures=${fail}`);
          process.exit(fail ? 1 : 0);
          EOF

          cat > smoke.mjs <<'EOF'
          const subpaths = ['ex-search', 'ex-search/types', 'ex-search/precision', 'ex-search/react'];
          let fail = 0;
          for (const s of subpaths) {
            try {
              const m = await import(s);
              console.log(`ok   import ${s}: ${Object.keys(m).sort().join(',')}`);
            } catch (e) {
              fail++;
              console.error(`FAIL import ${s}: ${e.code} ${e.message}`);
            }
          }
          const { search, ExSearch } = await import('ex-search');
          const r = search([{ n: 'Istanbul' }, { n: 'Ankara' }], 'ista', { keys: [{ name: 'n', weight: 1 }] });
          if (r.length !== 1 || r[0].n !== 'Istanbul') { fail++; console.error('FAIL search() result', JSON.stringify(r)); }
          const a = new ExSearch({ keys: [{ name: 'n', weight: 1 }], useWorker: true }).setData([{ n: 'Istanbul' }]);
          const ar = await a.searchAsync('ista'); // no global Worker in Node -> sync fallback
          if (ar.length !== 1) { fail++; console.error('FAIL searchAsync fallback', JSON.stringify(ar)); }
          console.log(`import smoke on node ${process.version}: failures=${fail}`);
          process.exit(fail ? 1 : 0);
          EOF

          node smoke.cjs
          node smoke.mjs

      # ./react must share the core with the root entry: both entries have to
      # import the same chunk file (one ExSearch class, shipped once). The check
      # follows relative imports, so it survives minification (no class-name regex).
      - name: Smoke test shared core across entries (CJS and ESM)
        run: |
          cd "$SMOKE_WORK/consumer"
          cat > shared-core.cjs <<'EOF'
          const fs = require('fs'), path = require('path');
          const dist = path.join(process.cwd(), 'node_modules/ex-search/dist');
          const relDeps = (file, re) => {
            const src = fs.readFileSync(file, 'utf8');
            return new Set([...src.matchAll(re)].map((m) => path.resolve(path.dirname(file), m[1])));
          };
          let fail = 0;
          for (const [ext, re] of [['cjs', /require\(["'](\.{1,2}\/[^"']+)["']\)/g], ['mjs', /from\s*["'](\.{1,2}\/[^"']+)["']/g]]) {
            const main = relDeps(path.join(dist, `index.${ext}`), re);
            const react = relDeps(path.join(dist, `react/index.${ext}`), re);
            const shared = [...main].filter((f) => react.has(f));
            console.log(`${ext}: index -> ${[...main].map((f) => path.relative(dist, f))}; react -> ${[...react].map((f) => path.relative(dist, f))}; shared -> ${shared.map((f) => path.relative(dist, f))}`);
            if (shared.length === 0 || !shared.every((f) => fs.existsSync(f))) { fail++; console.error(`FAIL ${ext}: entries do not share a chunk`); }
          }
          // The shared chunk is the only module both entries import: its exports
          // must be the very ExSearch class the root entry exposes.
          const main = require('ex-search'); require('ex-search/react');
          const sharedFile = [...relDeps(path.join(dist, 'index.cjs'), /require\(["'](\.{1,2}\/[^"']+)["']\)/g)]
            .find((f) => relDeps(path.join(dist, 'react/index.cjs'), /require\(["'](\.{1,2}\/[^"']+)["']\)/g).has(f));
          const chunk = require(sharedFile);
          // Minification renames the chunk's exports (a, b, c, ...), so find the
          // class by identity instead of by the name `ExSearch`.
          const Cls = Object.values(chunk).find((v) => v === main.ExSearch);
          if (!Cls) { fail++; console.error('FAIL react entry core is a different ExSearch class'); }
          else if (!(new Cls({ keys: [] }) instanceof main.ExSearch)) { fail++; console.error('FAIL instanceof across entries'); }
          process.exit(fail ? 1 : 0);
          EOF
          node shared-core.cjs

      - name: Smoke test published types (skipLibCheck off)
        run: |
          cd "$SMOKE_WORK/consumer"
          cat > types-smoke.mts <<'EOF'
          import { search, type SearchResult } from 'ex-search';
          import { exponentialSearch } from 'ex-search/precision';
          import type { SearchConfig } from 'ex-search/types';
          import { useExSearch } from 'ex-search/react';
          const cfg: SearchConfig<{ n: string }> = { keys: [{ name: 'n', weight: 1 }] };
          export const r: SearchResult<{ n: string }>[] = search([{ n: 'a' }], 'a', cfg);
          export const i: number = exponentialSearch([1, 2, 3], 2);
          export const h = useExSearch;
          EOF
          # Call tsc through node: .bin/tsc is a shell/cmd shim on Windows runners.
          TSC="$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc"
          node "$TSC" --ignoreConfig --noEmit --strict --skipLibCheck false --module node16 --moduleResolution node16 types-smoke.mts
          node "$TSC" --ignoreConfig --noEmit --strict --skipLibCheck false --module preserve --moduleResolution bundler types-smoke.mts
          # .cts resolves the CJS typings (.d.ts); .mts above resolves .d.mts.
          cp types-smoke.mts types-smoke.cts
          node "$TSC" --ignoreConfig --noEmit --strict --skipLibCheck false --module node16 --moduleResolution node16 types-smoke.cts

      # exsorted is a required peer; ex-flow and react stay optional, so the
      # root, ./precision and ./types entries must load with only exsorted.
      - name: Smoke test minimal install (required peer only)
        run: |
          TARBALL="$(ls "$SMOKE_WORK"/pack/*.tgz)"
          BARE="$SMOKE_WORK/bare"
          mkdir -p "$BARE" && cd "$BARE"
          echo '{ "name": "smoke-bare", "private": true }' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL" exsorted@^1.1.0
          node -e "require('ex-search'); require('ex-search/precision'); require('ex-search/types'); console.log('minimal require ok')"
          node --input-type=module -e "await import('ex-search'); await import('ex-search/precision'); await import('ex-search/types'); console.log('minimal import ok')"

      # ex-flow is an optional peer: the published typings must not import it.
      # Here only exsorted and react (for ./react types) are installed, with
      # skipLibCheck off, so a stray `from 'ex-flow'` in any .d.ts fails TS2307.
      - name: Smoke test published types without ex-flow (skipLibCheck off)
        run: |
          TARBALL="$(ls "$SMOKE_WORK"/pack/*.tgz)"
          NOFLOW="$SMOKE_WORK/noflow"
          mkdir -p "$NOFLOW" && cd "$NOFLOW"
          echo '{ "name": "smoke-noflow", "private": true }' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL" exsorted@^1.1.0 react@^19 @types/react@^19
          if [ -e node_modules/ex-flow ]; then echo "ex-flow must not be installed here"; exit 1; fi
          # Doc comments may mention ex-flow; only an import/require of it is a defect.
          if grep -rlE "(from|import|require)[ (]*['\"]ex-flow" node_modules/ex-search/dist --include='*.d.ts' --include='*.d.mts'; then
            echo "published typings import ex-flow"; exit 1
          fi
          cat > types-smoke.mts <<'EOF'
          import { search, type SearchResult, type ExFlowResultItem } from 'ex-search';
          import { exponentialSearch } from 'ex-search/precision';
          import type { SearchConfig, ExFlowResultItem as TypesItem } from 'ex-search/types';
          import { useExSearch, useExSearchAsync } from 'ex-search/react';
          const cfg: SearchConfig<{ n: string }> = { keys: [{ name: 'n', weight: 1 }] };
          export const r: SearchResult<{ n: string }>[] = search([{ n: 'a' }], 'a', cfg);
          export const f: ExFlowResultItem<{ n: string }> = { n: 'a', exFlowPriority: 1 };
          export const t: TypesItem<{ n: string }> = f;
          export const i: number = exponentialSearch([1, 2, 3], 2);
          export const h = [useExSearch, useExSearchAsync];
          EOF
          TSC="$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc"
          node "$TSC" --ignoreConfig --noEmit --strict --skipLibCheck false --module node16 --moduleResolution node16 types-smoke.mts
          node "$TSC" --ignoreConfig --noEmit --strict --skipLibCheck false --module preserve --moduleResolution bundler types-smoke.mts
          # .cts resolves the CJS typings (.d.ts); .mts above resolves .d.mts.
          cp types-smoke.mts types-smoke.cts
          node "$TSC" --ignoreConfig --noEmit --strict --skipLibCheck false --module node16 --moduleResolution node16 types-smoke.cts
